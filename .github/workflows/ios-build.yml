name: Build Mobile Apps
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Get Version
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Capacitor Sync
        run: npx cap sync ios

      - name: Build for Simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -sdk iphonesimulator \
                     -derivedDataPath build \
                     -configuration Debug \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      - name: Zip App for Appetize
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/MemoryAtlasv${{ steps.package-version.outputs.version }}.zip" App.app

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemoryAtlasv${{ steps.package-version.outputs.version }}-ios
          path: MemoryAtlasv${{ steps.package-version.outputs.version }}.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Get Version
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Find and Move APK
        run: |
          find android/app/build/outputs/apk/debug/ -name "*.apk" -exec mv {} MemoryAtlasv${{ steps.package-version.outputs.version }}.apk \;

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemoryAtlasv${{ steps.package-version.outputs.version }}-android
          path: MemoryAtlasv${{ steps.package-version.outputs.version }}.apk

